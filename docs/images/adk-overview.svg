<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="ADK 如何组织模型判断、工具执行和任务状态"><title>ADK 如何组织模型判断、工具执行和任务状态</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:17px;letter-spacing:1px}.title{font-size:42px;font-weight:700}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="490" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">认识 ADK / 把一次模型回答，组织成一个能完成任务的应用</text><rect x="40" y="95" width="210" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="60" y="131" class="sub" style="font-size:22px">用户提出任务</text><text x="60" y="161" class="small" style="font-size:15px">“研究 GOOGL 下周趋势”</text><rect x="300" y="85" width="855" height="285" rx="18" fill="#0d2233" stroke="#51e3c2" stroke-dasharray="6 5"/><text x="325" y="121" class="tag">ADK：组织角色、调用工具、保存状态、安排流程</text><rect x="335" y="160" width="230" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="355" y="196" class="sub" style="font-size:22px">Gemini 判断下一步</text><text x="355" y="226" class="small" style="font-size:15px">理解目标 · 选方法 · 解释证据</text><rect x="650" y="160" width="245" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="670" y="196" class="sub" style="font-size:22px">Tool 执行具体操作</text><text x="670" y="226" class="small" style="font-size:15px">取行情 · 算指标 · 返回结果</text><path class="flow" d="M250 144 H285"/><path class="flow" d="M565 198 H640"/><path class="flow" d="M650 235 H575"/><text x="580" y="180" class="small" style="font-size:15px">调用</text><text x="583" y="265" class="small" style="font-size:15px">结果</text><text x="337" y="318" class="small">Skill 提供方法；Session / State 传递本次任务的信息。</text><text x="337" y="347" class="small">Workflow 安排研究先后；事件记录用于解释过程。</text><text x="40" y="422" class="sub">Gemini 是模型；ADK 是构建和运行 Agent 应用的开源框架。</text><text x="40" y="458" class="small">本项目中，模型与工具会往返多次，最后才形成一份可核对的报告。</text></svg>
