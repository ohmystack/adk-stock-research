<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="EAGER 与 LAZY 的目录披露时机和典型运行路径"><title>EAGER 与 LAZY 的目录披露时机和典型运行路径</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker><marker id="dataarrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#bda7ff" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:18px;letter-spacing:1px}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}.dataflow{stroke:#bda7ff;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#dataarrow)}</style><rect width="1200" height="560" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">EAGER 与 LAZY / 改变的是目录何时进入模型上下文</text><text x="40" y="96" class="sub">EAGER：先给菜单，直接选择方法</text><rect x="40" y="115" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="58" y="149" class="sub" style="font-size:21px">① 首个请求包含目录</text><text x="58" y="180" class="small" style="font-size:15px">名称和描述进入系统指令</text><rect x="330" y="115" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="348" y="149" class="sub" style="font-size:21px">② 选择并加载方法</text><text x="348" y="180" class="small" style="font-size:15px">调用 load_skill</text><rect x="620" y="115" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="638" y="149" class="sub" style="font-size:21px">③ 按需读取与执行</text><text x="638" y="180" class="small" style="font-size:15px">参考资料、工具或脚本</text><rect x="910" y="115" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="928" y="149" class="sub" style="font-size:21px">④ 形成结果</text><text x="928" y="180" class="small" style="font-size:15px">完成当前任务</text><path class="flow" d="M290 162 H320"/><path class="flow" d="M580 162 H610"/><path class="flow" d="M870 162 H900"/><text x="40" y="280" class="sub">LAZY：先需要方法，再索取菜单</text><rect x="40" y="300" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="58" y="334" class="sub" style="font-size:21px">① 首个请求不含目录</text><text x="58" y="365" class="small" style="font-size:15px">先告知有哪些 Skill 工具</text><rect x="330" y="300" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="348" y="334" class="sub" style="font-size:21px">② 获取可用方法目录</text><text x="348" y="365" class="small" style="font-size:15px">调用 list_skills</text><rect x="620" y="300" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="638" y="334" class="sub" style="font-size:21px">③ 选择并加载方法</text><text x="638" y="365" class="small" style="font-size:15px">调用 load_skill</text><rect x="910" y="300" width="250" height="95" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="928" y="334" class="sub" style="font-size:21px">④ 按需读取与执行</text><text x="928" y="365" class="small" style="font-size:15px">再形成当前任务结果</text><path class="flow" d="M290 347 H320"/><path class="flow" d="M580 347 H610"/><path class="flow" d="M870 347 H900"/><text x="40" y="455" class="sub">两种模式都按需加载方法正文；LAZY 的目录返回也会占用上下文。</text><text x="40" y="495" class="small">这里画的是典型工具步骤，不代表固定的模型请求次数。</text><text x="40" y="529" class="small">原生 LAZY 已知名称时也能直接加载；本课程用 Prompt 要求先列目录，便于观察对照。</text></svg>
