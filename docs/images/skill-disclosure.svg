<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Skill 的三级渐进披露以及方法与工具的区别"><title>Skill 的三级渐进披露以及方法与工具的区别</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:17px;letter-spacing:1px}.title{font-size:42px;font-weight:700}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="480" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">认识 ADK + Skill / 像查阅研究手册一样，按需展开专业方法</text><rect x="40" y="100" width="340" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="60" y="136" class="sub" style="font-size:22px">① 先看目录</text><text x="60" y="166" class="small" style="font-size:15px">名称和描述：判断是否相关</text><rect x="430" y="100" width="340" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="450" y="136" class="sub" style="font-size:22px">② 再读方法</text><text x="450" y="166" class="small" style="font-size:15px">load_skill：加载分析步骤</text><rect x="820" y="100" width="340" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="840" y="136" class="sub" style="font-size:22px">③ 按需找资料</text><text x="840" y="166" class="small" style="font-size:15px">load_skill_resource：读参考</text><path class="flow" d="M380 150 H420"/><path class="flow" d="M770 150 H810"/><rect x="40" y="255" width="535" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="60" y="291" class="sub" style="font-size:22px">方法手册：technical-trend</text><text x="60" y="321" class="small" style="font-size:15px">用哪些指标？按什么顺序解释？什么情况要降低信心？</text><rect x="625" y="255" width="535" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="645" y="291" class="sub" style="font-size:22px">计算工具：calculate_indicators</text><text x="645" y="321" class="small" style="font-size:15px">真正计算均线、RSI、ATR，并返回可核验数值。</text><text x="40" y="410" class="sub">Skill 解释“怎样做”；Tool 提供“实际能做什么”。</text><text x="40" y="448" class="small">加载 Skill 不会自动安装依赖或创建工具；脚本也需要宿主提供执行后端。</text></svg>
