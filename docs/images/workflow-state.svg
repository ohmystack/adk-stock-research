<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-label="Workflow 如何经 Session State 传递技术分析与事件分析到风险审查"><title>Workflow 如何经 Session State 传递技术分析与事件分析到风险审查</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker><marker id="dataarrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#bda7ff" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:18px;letter-spacing:1px}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}.dataflow{stroke:#bda7ff;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#dataarrow)}</style><rect width="1200" height="825" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">Workflow 与 State / 顺序控制、证据读取、结果传递是三条相连的线</text><rect x="40" y="85" width="370" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="58" y="119" class="sub" style="font-size:21px">Python 证据包 bundle</text><text x="58" y="150" class="small" style="font-size:15px">完整行情、计算指标、新闻标题</text><rect x="510" y="85" width="650" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="528" y="119" class="sub" style="font-size:21px">创建 Session：只写入任务参数</text><text x="528" y="150" class="small" style="font-size:15px">state = {ticker: 股票代码, as_of: 证据截至时间}</text><path class="flow" d="M410 130 H500"/><text x="420" y="112" class="small" style="font-size:14px">提取参数</text><text x="40" y="220" class="small">各角色调用工具读取同一份 bundle；原始证据不全文写入 State。</text><rect x="40" y="255" width="300" height="105" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="58" y="289" class="sub" style="font-size:21px">① technical：技术分析</text><text x="58" y="320" class="small" style="font-size:15px">输出 Analysis；output_key=&quot;technical&quot;</text><rect x="450" y="255" width="300" height="105" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="468" y="289" class="sub" style="font-size:21px">② catalyst：事件分析</text><text x="468" y="320" class="small" style="font-size:15px">输出 Analysis；output_key=&quot;catalyst&quot;</text><rect x="860" y="255" width="300" height="105" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="878" y="289" class="sub" style="font-size:21px">③ review：风险审查</text><text x="878" y="320" class="small" style="font-size:15px">读取两份分析；output_key=&quot;review&quot;</text><path class="flow" d="M340 300 H440"/><path class="flow" d="M750 300 H850"/><text x="354" y="282" class="small" style="font-size:15px">完成后</text><text x="764" y="282" class="small" style="font-size:15px">完成后</text><rect x="40" y="430" width="1120" height="195" rx="18" fill="#0d2233" stroke="#a5bfd2" stroke-dasharray="6 5"/><rect x="70" y="455" width="310" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="88" y="489" class="sub" style="font-size:21px">technical: Analysis</text><text x="88" y="520" class="small" style="font-size:15px">摘要 · 引用 · 反证 · 缺失信息</text><rect x="445" y="455" width="310" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="463" y="489" class="sub" style="font-size:21px">catalyst: Analysis</text><text x="463" y="520" class="small" style="font-size:15px">摘要 · 引用 · 反证 · 缺失信息</text><rect x="820" y="455" width="310" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="838" y="489" class="sub" style="font-size:21px">review: Decision</text><text x="838" y="520" class="small" style="font-size:15px">方向 · 建议 · 信心 · 失效条件</text><path class="flow" d="M190 360 V395 H225 V445"/><path class="flow" d="M600 360 V395 H600 V445"/><path class="flow" d="M1010 360 V395 H975 V445"/><text x="72" y="415" class="small" style="font-size:15px">写入 output_key</text><text x="470" y="415" class="small" style="font-size:15px">写入 output_key</text><text x="1020" y="415" class="small" style="font-size:15px">写入 output_key</text><text x="65" y="601" class="small">共享 State</text><text x="265" y="601" class="small">初始参数和各角色最终输出</text><text x="650" y="601" class="small">ADK 用 state_delta 保存更新</text><path class="dataflow" d="M225 545 V675 H1180 V315 H1160"/><path class="dataflow" d="M600 545 V645 H1170 V345 H1160"/><text x="40" y="720" class="sub">虚线：Review 指令中的 {technical} / {catalyst} 读取前两步结果。</text><text x="40" y="757" class="small">State 不会自动变成模型知识；需要通过指令模板或工具显式取用。</text><text x="40" y="794" class="small">最终代码再执行 validate_decision，校验引用与降级规则，然后保存报告。</text></svg>
