<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Skill 在加载、切换与下一轮任务中的生命周期"><title>Skill 在加载、切换与下一轮任务中的生命周期</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:17px;letter-spacing:1px}.title{font-size:42px;font-weight:700}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="340" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">生命周期 / 一轮任务可以包含多次模型调用与工具调用</text><rect x="40" y="100" width="235" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="60" y="136" class="sub" style="font-size:22px">01 / 加载风险方法</text><text x="60" y="166" class="small" style="font-size:15px">BOUNDED · 激活上限为 1</text><rect x="335" y="100" width="235" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="355" y="136" class="sub" style="font-size:22px">02 / 切换报告方法</text><text x="355" y="166" class="small" style="font-size:15px">淘汰旧方法，激活报告方法</text><rect x="630" y="100" width="235" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="650" y="136" class="sub" style="font-size:22px">03 / 加载临时方法</text><text x="650" y="166" class="small" style="font-size:15px">EPHEMERAL · 本轮持续有效</text><rect x="925" y="100" width="235" height="100" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="945" y="136" class="sub" style="font-size:22px">04 / 进入下一轮</text><text x="945" y="166" class="small" style="font-size:15px">临时失效，报告方法保留</text><path class="flow" d="M275 150 H325"/><path class="flow" d="M570 150 H620"/><path class="flow" d="M865 150 H915"/><text x="40" y="265" class="sub">卸载改变后续请求中的方法指令和相应工具声明。</text><text x="40" y="303" class="small">已保存的分析事实、证据、报告和历史记录不会因此被清空。</text></svg>
