<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="三个研究角色如何共享证据与传递结果"><title>三个研究角色如何共享证据与传递结果</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#122638"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#51e3c2" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#e8f2ff}.sub{fill:#a5bfd2;font-size:20px}.tag{fill:#51e3c2;font-size:17px;letter-spacing:1px}.title{font-size:42px;font-weight:700}.small{font-size:16px;fill:#a5bfd2}.flow{stroke:#51e3c2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="440" rx="24" fill="url(#bg)"/><text x="40" y="50" class="tag">系统架构 / 使用同一份证据，承担不同研究职责</text><rect x="40" y="90" width="280" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="60" y="126" class="sub" style="font-size:22px">数据与计算工具</text><text x="60" y="156" class="small" style="font-size:15px">行情 · 指标 · 新闻标题</text><rect x="460" y="90" width="280" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="480" y="126" class="sub" style="font-size:22px">技术分析师</text><text x="480" y="156" class="small" style="font-size:15px">data-quality / technical-trend</text><rect x="460" y="225" width="280" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="480" y="261" class="sub" style="font-size:22px">事件分析师</text><text x="480" y="291" class="small" style="font-size:15px">news-catalyst</text><rect x="880" y="155" width="280" height="90" rx="14" fill="#132b3d" stroke="#51e3c2" stroke-opacity=".7"/><text x="900" y="191" class="sub" style="font-size:22px">风险审查员</text><text x="900" y="221" class="small" style="font-size:15px">risk-review / decision-report</text><path class="flow" d="M320 135 H450"/><path class="flow" d="M320 135 H380 V270 H450"/><path class="flow" d="M740 135 H810 V200 H870"/><path class="flow" d="M740 270 H810 V200 H870"/><text x="42" y="365" class="sub">Workflow 默认顺序调度；图中的分叉表示证据依赖，不表示并行执行。</text><text x="42" y="401" class="small">Skill 先检查再加载；最终输出 JSON、Markdown 和调用记录，不执行证券交易。</text></svg>
