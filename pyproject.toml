[project]
name = "adk-skills-workshop"
version = "0.1.0"
description = "Gemini × ADK Skills: an observable research team"
requires-python = ">=3.11"
dependencies = ["google-adk==2.13.0", "yfinance>=0.2", "PyYAML>=6", "python-dotenv>=1", "exchange-calendars>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
workshop = "stock_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
